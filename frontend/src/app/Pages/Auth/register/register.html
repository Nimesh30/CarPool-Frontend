<div class="register-container">
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-card">

    <h2>→ Create Your RideConnect Account</h2>

    <label>Email</label>
    <input type="email" placeholder="you@example.com" formControlName="email" />
    <!-- <div class="error" *ngIf="registerForm.controls.email.invalid && registerForm.controls.email.touched">
      Invalid Email
    </div> -->

    <label>Username</label>
    <input type="text" placeholder="Enter username" formControlName="username" />
    <!-- <div class="error" *ngIf="registerForm.controls.username.invalid && registerForm.controls.username.touched">
      Minimum 3 characters required
    </div> -->

    <label>Phone</label>
    <input type="text" placeholder="9876543210" formControlName="phone" />
    <!-- <div class="error" *ngIf="registerForm.controls.phone.invalid && registerForm.controls.phone.touched">
      Enter valid phone number
    </div> -->

    <label>Password</label>
    <input type="password" placeholder="Your password" formControlName="password" />
    <!-- <div class="error" *ngIf="registerForm.controls.password.invalid && registerForm.controls.password.touched">
      Minimum 6 characters required
    </div> -->

    <button type="submit">Register</button>

    <p class="login-link">
      Already have an account? <a routerLink="/login">Login</a>
    </p>

    <p [style.color]="isError ? 'red' : 'green'">
      {{ message }}
    </p>

  </form>
</div>
