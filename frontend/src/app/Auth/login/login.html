<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-card">

    <h2>→ Login to RideConnect</h2>

    <label>Email</label>
    <input type="email" placeholder="you@example.com" formControlName="email" />

    <div class="error" *ngIf="loginForm.controls.email.invalid && loginForm.controls.email.touched">
      Invalid Email
    </div>

    <label>Password</label>
    <input type="password" placeholder="Your password" formControlName="password" />

    <div class="error" *ngIf="loginForm.controls.password.invalid && loginForm.controls.password.touched">
      Password required
    </div>

    <button type="submit">Login</button>

    <p class="register-link">
      Don't have an account? <a routerLink="/register" routerLinkActive="active" >Register</a>
    </p>

    <p [style.color]="isError ? 'red' : 'green'">
      {{ message }}
    </p>

  </form>
</div>
